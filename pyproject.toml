[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmcodec"
dynamic = ["version"]
description = "Encode sentences as real numbers in [0, 1] using a tiny language model as an arithmetic coder."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "llmcodec contributors" }]
keywords = ["llm", "arithmetic-coding", "compression", "tinystories", "transformer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.23",
    "torch>=2.0",
]

[project.optional-dependencies]
data = [
    "datasets>=2.14",
    "huggingface_hub>=0.20",
    "tqdm>=4.65",
]
hf = [
    "transformers>=4.56",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "yapf>=0.40",
    "ruff>=0.4",
]
all = ["llmcodec[data,hf,dev]"]

[project.scripts]
llmcodec = "llmcodec.cli:main"

[project.urls]
Homepage = "https://github.com/davidel/llmcodec"
Repository = "https://github.com/davidel/llmcodec"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "llmcodec.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "slow: tests that train a model or require the network",
    "hf: tests that download pretrained Hugging Face artifacts (also slow)",
]

[tool.coverage.run]
branch = true
source = ["llmcodec"]

[tool.coverage.report]
# The CLI parsers and the training loop body are only exercised by the
# network-free ``slow`` tests, so the fast suite targets a realistic floor
# rather than full coverage.
fail_under = 65
show_missing = true
skip_covered = true

# Formatting is handled by yapf, configured in .style.yapf (Google style,
# 2-space indent, 88-column limit).  Ruff is used for linting only.
[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
