name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests examples
      - name: Format check (yapf)
        run: yapf --diff --recursive --style .style.yapf src tests examples
      - name: Doctests
        run: >-
          pytest --doctest-modules
          src/llmcodec/interval.py
          src/llmcodec/candidates.py
          src/llmcodec/vocab.py
      - name: Tests
        run: pytest -m "not slow" --cov=llmcodec --cov-report=term-missing
